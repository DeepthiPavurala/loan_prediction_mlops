[pytest]
testpaths = tests

python_files = test_*.py

markers =
    unit: Unit tests with no Docker dependency
    docker: Tests requiring Docker backend (skipped without --run-docker)
    api: API endpoint tests
    smoke: Critical happy-path tests
    negative: Negative validation tests
    boundary: Boundary value tests
    contract: OpenAPI contract tests
    model: Model artifact and quality tests
    mlops: Drift monitoring, logging, and operational tests
    regression: Golden output regression tests (break if model behavior changes)
    sensitivity: Field sensitivity tests (decision boundary exploration)
    e2e: End-to-end tests covering full pipeline flow

addopts =
    -ra
    --strict-markers
    --html=reports/test_report.html
    --self-contained-html
